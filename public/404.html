<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>

    <script>
      const l = window.location;

      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          "/?redirect=" +
          encodeURIComponent(l.pathname + l.search + l.hash),
      );
    </script>
  </head>

  <body></body>
</html>
